name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '\r\n' | xargs)
          USERNAME=$(printf '%s' "$USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "Docker Hub username length: ${#USERNAME}"
          docker build -t "${USERNAME}/devops-ci-cd-lab:latest" .evops-ci-cd-lab:latest" .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '\r\n' | xargs)
          USERNAME=$(printf '%s' "$USERNAME" | tr '[:upper:]' '[:lower:]')
          docker push "${USERNAME}/devops-ci-cd-lab:latest"